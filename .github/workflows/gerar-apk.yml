name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: unzip Bloco-Simples-Projeto.zip -d projeto
      - name: Liberar prints
        run: sed -i '/getWindow().setFlags.*FLAG_SECURE/d' projeto/bloco-simples/app/src/main/java/br/com/philipe/bloco/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar ferramentas Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gerar aplicativo
        working-directory: projeto/bloco-simples
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Bloco-Simples-APK
          path: projeto/bloco-simples/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
